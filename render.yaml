# Render blueprint for the Flowcraft API (free Docker web service).
# Deploy: push to GitHub → Render → New → Blueprint → pick this repo.
# Set the `sync: false` secrets in the Render dashboard (from Neon + Inngest Cloud).
services:
  - type: web
    name: flowcraft-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # Neon connection string
        sync: false
      - key: WEB_ORIGIN # the Vercel web URL (for CORS)
        sync: false
      - key: INNGEST_EVENT_KEY # from Inngest Cloud
        sync: false
      - key: INNGEST_SIGNING_KEY # from Inngest Cloud
        sync: false
